<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DeskNest 统计看板</title>
<style>
  :root{
    --bg:#101311; --card:#181c19; --line:#262c28; --txt:#e8ece9; --dim:#8fa398;
    --acc:#34d399; --acc2:#10b981; --red:#f87171;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--bg);color:var(--txt);font:15px/1.6 "Segoe UI","Microsoft YaHei",sans-serif;padding:24px;max-width:1100px;margin:0 auto}
  h1{font-size:22px;font-weight:600;letter-spacing:.5px}
  h1 .dot{color:var(--acc)}
  .bar{display:flex;align-items:center;gap:14px;margin-bottom:20px;flex-wrap:wrap}
  .bar .sub{color:var(--dim);font-size:13px}
  .btn{background:transparent;border:1px solid var(--line);color:var(--acc);border-radius:8px;padding:6px 16px;cursor:pointer;font-size:13px}
  .btn:hover{border-color:var(--acc)}
  .cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:14px;margin-bottom:22px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px 18px}
  .card .k{color:var(--dim);font-size:12px;margin-bottom:6px}
  .card .v{font-size:30px;font-weight:700;color:var(--acc);font-variant-numeric:tabular-nums}
  .card .v small{font-size:14px;color:var(--dim);font-weight:400}
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:22px}
  @media(max-width:760px){.grid{grid-template-columns:1fr}}
  .panel{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px 18px}
  .panel h2{font-size:14px;color:var(--dim);font-weight:600;margin-bottom:12px}
  .hbar{display:flex;align-items:center;gap:10px;margin:6px 0}
  .hbar .lbl{width:90px;color:var(--dim);font-size:13px;text-align:right;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .hbar .track{flex:1;height:18px;background:#0d100e;border-radius:5px;overflow:hidden}
  .hbar .fill{height:100%;background:linear-gradient(90deg,var(--acc2),var(--acc));border-radius:5px;min-width:2px}
  .hbar .num{width:44px;font-size:13px;color:var(--txt);font-variant-numeric:tabular-nums}
  .chart{display:flex;align-items:flex-end;gap:6px;height:150px;padding-top:8px}
  .col{flex:1;display:flex;flex-direction:column;align-items:center;gap:5px;height:100%;justify-content:flex-end}
  .col .stick{width:70%;max-width:34px;background:linear-gradient(180deg,var(--acc),var(--acc2));border-radius:4px 4px 0 0;min-height:2px}
  .col .d{font-size:11px;color:var(--dim);white-space:nowrap}
  .col .n{font-size:12px;color:var(--txt)}
  table{width:100%;border-collapse:collapse;font-size:13px}
  th{color:var(--dim);text-align:left;font-weight:600;padding:6px 8px;border-bottom:1px solid var(--line)}
  td{padding:6px 8px;border-bottom:1px solid #1d221f;font-variant-numeric:tabular-nums}
  tr:hover td{background:#1b201d}
  .tag{display:inline-block;background:#0d100e;border:1px solid var(--line);border-radius:20px;padding:0 10px;font-size:12px;color:var(--dim)}
  .tag.on{color:var(--acc);border-color:var(--acc2)}
  #err{display:none;color:var(--red);background:#1d1516;border:1px solid #3a2224;border-radius:10px;padding:12px 16px;margin-bottom:18px;font-size:14px}
  .foot{color:var(--dim);font-size:12px;margin-top:18px;text-align:center}
</style>
</head>
<body>
  <div class="bar">
    <h1>DeskNest <span class="dot">·</span> 统计看板</h1>
    <span class="sub" id="status">加载中…</span>
    <span style="flex:1"></span>
    <button class="btn" onclick="load(true)">⟳ 立即刷新</button>
  </div>
  <div id="err"></div>
  <div class="cards">
    <div class="card"><div class="k">装机数（去重）</div><div class="v" id="c-inst">–</div></div>
    <div class="card"><div class="k">累计上报</div><div class="v" id="c-total">–</div></div>
    <div class="card"><div class="k">开机自启开启</div><div class="v" id="c-as">–</div></div>
    <div class="card"><div class="k">最新版本</div><div class="v" id="c-ver">–</div></div>
  </div>
  <div class="grid">
    <div class="panel"><h2>每日上报（近 14 天）</h2><div class="chart" id="daily"></div></div>
    <div class="panel">
      <h2>版本分布</h2><div id="versions"></div>
      <h2 style="margin-top:16px">语言分布</h2><div id="langs"></div>
    </div>
  </div>
  <div class="panel">
    <h2>最近上报明细</h2>
    <table><thead><tr><th>时间</th><th>用户</th><th>版本</th><th>语言</th><th>首次安装</th><th>自启</th></tr></thead>
    <tbody id="rows"></tbody></table>
  </div>
  <div class="foot">数据每 30 秒自动刷新 · 来源为匿名统计（随机标识，无个人信息）</div>

<script>
const API = 'https://1418962927-0b6gegz4v1.ap-nanjing.tencentscf.com';
const esc = s => String(s??'').replace(/[&<>"]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function hbars(el, obj, total){
  const ks = Object.keys(obj).sort((a,b)=>obj[b]-obj[a]).slice(0,8);
  el.innerHTML = ks.length ? ks.map(k=>{
    const w = total? Math.round(obj[k]/total*100) : 0;
    return `<div class="hbar"><div class="lbl" title="${esc(k)}">${esc(k)||'-'}</div><div class="track"><div class="fill" style="width:${w}%"></div></div><div class="num">${obj[k]}</div></div>`;
  }).join('') : '<span class="sub">暂无数据</span>';
}
async function load(manual){
  const st = document.getElementById('status'), err = document.getElementById('err');
  try{
    st.textContent = '刷新中…'; err.style.display='none';
    const r = await fetch(API+'/stats?t='+Date.now());
    const d = await r.json();
    if(d.error) throw new Error(d.error);
    const s = d.summary;
    document.getElementById('c-inst').textContent = s.installs;
    document.getElementById('c-total').textContent = s.total;
    const rate = s.total? Math.round(s.autostartOn/s.total*100):0;
    document.getElementById('c-as').innerHTML = rate+'<small> %</small>';
    document.getElementById('c-ver').textContent = s.newestVersion || '–';
    // 每日柱状（近 14 天）
    const days = Object.keys(s.daily).sort().slice(-14);
    const mx = Math.max(1, ...days.map(k=>s.daily[k]));
    document.getElementById('daily').innerHTML = days.map(k=>{
      const h = Math.round(s.daily[k]/mx*100);
      return `<div class="col"><div class="n">${s.daily[k]}</div><div class="stick" style="height:${Math.max(h,4)}%"></div><div class="d">${k.slice(5)}</div></div>`;
    }).join('');
    hbars(document.getElementById('versions'), s.versions, s.total);
    hbars(document.getElementById('langs'), s.langs, s.total);
    document.getElementById('rows').innerHTML = d.records.slice(0,50).map(r=>
      `<tr><td>${esc(r.received_at)}</td><td>${esc((r.install_id||'').slice(0,8))}…</td><td>${esc(r.version)}</td><td>${esc(r.lang)}</td><td>${esc(r.first_seen)}</td><td><span class="tag ${String(r.autostart)==='1'?'on':''}">${String(r.autostart)==='1'?'开':'关'}</span></td></tr>`
    ).join('') || '<tr><td colspan="6" style="color:var(--dim)">暂无数据</td></tr>';
    st.textContent = '更新于 '+new Date().toLocaleTimeString('zh-CN',{hour12:false})+' · 30 秒后自动刷新';
  }catch(e){
    err.style.display='block';
    err.textContent = '加载失败：'+(e&&e.message||e)+'（若刚部署 /stats，请确认函数代码已更新且超时已改为 20 秒）';
    st.textContent = '加载失败';
  }
}
load();
setInterval(load, 30000);
</script>
</body>
</html>
